name: Brewlight
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    ARCHS: "$(ARCHS_STANDARD)"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
targets:
  Brewlight:
    type: application
    platform: macOS
    sources:
      - Brewlight
    dependencies:
      - target: BrewlightAskPass
        embed: false
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_NAME: Brewlight
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        INFOPLIST_FILE: Brewlight/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Brewlight/Resources/Brewlight.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: $(APP_VERSION)
        CURRENT_PROJECT_VERSION: $(APP_BUILD)
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Release:
          ENABLE_DEBUG_DYLIB: NO
  BrewlightAskPass:
    type: tool
    platform: macOS
    sources:
      - BrewlightAskPass
    settings:
      base:
        PRODUCT_NAME: BrewlightAskPass
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).askpass
        SKIP_INSTALL: YES
  BrewlightTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - BrewlightTests
    dependencies:
      - target: Brewlight
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Brewlight.app/Contents/MacOS/Brewlight
  BrewlightUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - BrewlightUITests
    dependencies:
      - target: Brewlight
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Brewlight
schemes:
  Brewlight:
    build:
      targets:
        Brewlight: all
        BrewlightTests: [test]
        BrewlightUITests: [test]
    test:
      targets:
        - BrewlightTests
        - BrewlightUITests
    run:
      # Run optimized so what you see is what users get; use Debug only when you need the debugger.
      config: Release
