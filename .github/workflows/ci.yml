name: CI
on:
  push:
  pull_request:
jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: xcodebuild -scheme Brewlight -destination 'platform=macOS' build CODE_SIGNING_ALLOWED=NO
      - name: Unit tests
        run: xcodebuild test -scheme Brewlight -destination 'platform=macOS' -only-testing:BrewlightTests CODE_SIGNING_ALLOWED=NO
